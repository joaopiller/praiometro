name: Release do app

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Perfil do eas.json
        type: choice
        options: [preview, production]
        default: preview
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Verifica o EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Configure o secret EXPO_TOKEN (https://expo.dev/settings/access-tokens)"
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - run: npm test -- --ci
      - run: eas build --platform android --profile ${{ inputs.profile || 'production' }} --non-interactive --no-wait
