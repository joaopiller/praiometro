[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "praiometro"
version = "2.0.0"
description = "Backend do Praiômetro: clima, mar, balneabilidade e avaliações das praias de Niterói"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "pymongo>=4.8",
    "google-auth>=2.30",
    "pyjwt[crypto]>=2.8",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "pdfplumber>=0.11",
    "schedule>=1.2",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
    "mongomock>=4.2",
    "ruff>=0.6",
]

[project.scripts]
praiometro-api = "praiometro.api.app:main"
praiometro-worker = "praiometro.worker:main"

[tool.setuptools.packages.find]
include = ["praiometro*"]

[tool.setuptools.package-data]
praiometro = ["dados/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning:mongomock.*"]

[tool.coverage.run]
source = ["praiometro"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]
